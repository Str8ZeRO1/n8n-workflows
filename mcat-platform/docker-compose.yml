version: "3.8"

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: ankane/pgvector:latest
    container_name: mcat_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcat
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcat-network

  # Redis for real-time state and caching
  redis:
    image: redis:7-alpine
    container_name: mcat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mcat-network

  # n8n workflow automation
  n8n:
    image: n8nio/n8n:latest
    container_name: mcat_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678
      # Use Postgres for n8n's own data
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=mcat
      - DB_POSTGRESDB_USER=postgres
      - DB_POSTGRESDB_PASSWORD=postgres
      - EXECUTIONS_PROCESS=main
      - N8N_BASIC_AUTH_ACTIVE=false
      # Allow CORS for local development
      - N8N_ALLOW_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./n8n:/import
    restart: unless-stopped
    networks:
      - mcat-network

  # FastAPI inference service
  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    container_name: mcat_fastapi
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mcat
      - REDIS_URL=redis://redis:6379/0
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/mcat/submit-answer
      - PORT=8000
      - PYTHONUNBUFFERED=1
      # Optional: OpenAI API key for embeddings
      # - OPENAI_API_KEY=${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./fastapi/app:/app/app
    restart: unless-stopped
    networks:
      - mcat-network

volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local

networks:
  mcat-network:
    driver: bridge
